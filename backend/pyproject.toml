[project]
name = "aus-budget-catalogue-backend"
version = "0.1.0"
description = "Backend API for the Australian budget measure catalogue"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "chromadb>=1.0.0",
  "openai>=1.82.0",
  "orjson>=3.10.0",
  "httpx>=0.28.0",
  "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.12.0",
  "mypy>=1.16.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
